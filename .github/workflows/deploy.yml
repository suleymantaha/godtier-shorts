name: Deploy

# The PR gate (Verify) is the only entry point to production: images are
# published and released only after that workflow succeeded on main.
on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}-api
  GPU_IMAGE_NAME: ${{ github.repository }}-gpu

jobs:
  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the CPU control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  publish-gpu:
    name: Publish GPU worker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Free runner disk space for the CUDA image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the GPU worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gpu
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.GPU_IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.REGISTRY }}/${{ env.GPU_IMAGE_NAME }}:main
          cache-from: type=gha,scope=gpu
          cache-to: type=gha,scope=gpu,mode=max

  deploy:
    name: Release CPU control plane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [publish-api, publish-gpu]
    environment: production

    steps:
      - name: Check whether a deploy target is configured
        id: target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [[ -n "$DEPLOY_HOST" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DEPLOY_HOST secret configured; images published, release skipped."
          fi

      - name: Check out the verified commit
        if: steps.target.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install the deploy SSH key
        if: steps.target.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ship the deploy script to the server
        if: steps.target.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          scp -i ~/.ssh/deploy_key scripts/deploy_production.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/deploy_production.sh"

      - name: Backup, migrate, release and health check
        if: steps.target.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          API_IMAGE: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          GPU_IMAGE: ${{ env.REGISTRY }}/${{ env.GPU_IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' API_IMAGE='$API_IMAGE' GPU_IMAGE='$GPU_IMAGE' \
             bash '$DEPLOY_DIR/deploy_production.sh'"

      - name: Remove the deploy SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
