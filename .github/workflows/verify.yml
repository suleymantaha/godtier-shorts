name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://godtier_test:task2-test-password@127.0.0.1:5432/godtier_test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: godtier_test
          POSTGRES_USER: godtier_test
          POSTGRES_PASSWORD: task2-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U godtier_test -d godtier_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run repository verification gate
        run: bash scripts/verify.sh
