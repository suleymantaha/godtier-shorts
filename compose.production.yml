name: godtier-shorts-production

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: production
      WORKER_MODE: api
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?R2_ENDPOINT_URL is required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?R2_BUCKET_NAME is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      IYZICO_API_BASE_URL: ${IYZICO_API_BASE_URL:?IYZICO_API_BASE_URL is required}
      IYZICO_API_KEY: ${IYZICO_API_KEY:?IYZICO_API_KEY is required}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:?IYZICO_SECRET_KEY is required}
      IYZICO_CALLBACK_URL: ${IYZICO_CALLBACK_URL:?IYZICO_CALLBACK_URL is required}
      IYZICO_MERCHANT_ID: ${IYZICO_MERCHANT_ID:?IYZICO_MERCHANT_ID is required}
      IYZICO_PLAN_REFERENCES_JSON: ${IYZICO_PLAN_REFERENCES_JSON:?IYZICO_PLAN_REFERENCES_JSON is required}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      TURNSTILE_TIMEOUT_SECONDS: ${TURNSTILE_TIMEOUT_SECONDS:-8}
      PREVIEW_REQUEST_LIMIT: ${PREVIEW_REQUEST_LIMIT:-1}
      BILLING_CHECKOUT_REQUEST_LIMIT: ${BILLING_CHECKOUT_REQUEST_LIMIT:-5}
      BILLING_CHECKOUT_REQUEST_WINDOW_SECONDS: ${BILLING_CHECKOUT_REQUEST_WINDOW_SECONDS:-60}
      BILLING_FAILED_CHECKOUT_LIMIT: ${BILLING_FAILED_CHECKOUT_LIMIT:-3}
      BILLING_FAILED_CHECKOUT_WINDOW_SECONDS: ${BILLING_FAILED_CHECKOUT_WINDOW_SECONDS:-600}
      JOB_START_REQUEST_LIMIT: ${JOB_START_REQUEST_LIMIT:-10}
      JOB_START_REQUEST_WINDOW_SECONDS: ${JOB_START_REQUEST_WINDOW_SECONDS:-60}
      CLERK_ISSUER_URL: ${CLERK_ISSUER_URL:?CLERK_ISSUER_URL is required}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:?CLERK_AUDIENCE is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DEBUG: "false"
      SOCIAL_ENCRYPTION_SECRET: ${SOCIAL_ENCRYPTION_SECRET:?SOCIAL_ENCRYPTION_SECRET is required}
      PREVIEW_MAX_SOURCE_SECONDS: ${PREVIEW_MAX_SOURCE_SECONDS:-3600}
      PREVIEW_MAX_TRANSCRIPTION_SECONDS: ${PREVIEW_MAX_TRANSCRIPTION_SECONDS:-900}
      PREVIEW_METADATA_TIMEOUT_SECONDS: ${PREVIEW_METADATA_TIMEOUT_SECONDS:-30}
      PREVIEW_REQUEST_WINDOW_SECONDS: ${PREVIEW_REQUEST_WINDOW_SECONDS:-30}
      PREVIEW_LIMITED_TRANSCRIPTION_ENABLED: ${PREVIEW_LIMITED_TRANSCRIPTION_ENABLED:-false}
      PREVIEW_TRANSCRIPTION_ENDPOINT_URL: ${PREVIEW_TRANSCRIPTION_ENDPOINT_URL:-}
      PREVIEW_TRANSCRIPTION_API_KEY: ${PREVIEW_TRANSCRIPTION_API_KEY:-}
      PREVIEW_TRANSCRIPTION_MODEL: ${PREVIEW_TRANSCRIPTION_MODEL:-whisper-1}
      PREVIEW_TRANSCRIPTION_TIMEOUT_SECONDS: ${PREVIEW_TRANSCRIPTION_TIMEOUT_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    networks:
      - edge
      - backend

  gpu-worker:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: Dockerfile.gpu
    restart: unless-stopped
    environment:
      APP_ENV: production
      WORKER_MODE: gpu
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?R2_ENDPOINT_URL is required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?R2_BUCKET_NAME is required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is required}
      GPU_HOURLY_COST_USD: ${GPU_HOURLY_COST_USD:?GPU_HOURLY_COST_USD is required}
      REQUIRE_CUDA_FOR_APP: "1"
      REQUIRE_NVENC_FOR_APP: "1"
      GODTIER_WORKSPACE: /scratch/workspace
      GPU_SCRATCH_ROOT: /scratch/jobs
      GODTIER_MODELS_DIR: /models
      HF_HOME: /models/huggingface
      YOLO_CONFIG_DIR: /models/ultralytics
      YOLO_MODEL_PATH: /models/yolo11s.pt
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - gpu_models:/models
      - gpu_scratch:/scratch
    networks:
      - edge
      - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" ping | grep PONG
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - backend

volumes:
  postgres_data:
  gpu_models:
  gpu_scratch:

networks:
  edge:
  backend:
    internal: true
